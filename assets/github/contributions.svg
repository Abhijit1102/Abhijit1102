<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180"><rect width="100%" height="100%" rx="18" fill="#161b2d"/><rect x="1" y="1" width="898" height="178" rx="17" fill="none" stroke="#2b3553"/><text x="30" y="42" fill="#c8d3f5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Contribution Activity</text><text x="30" y="90" fill="#c8d3f5" font-family="Inter,Arial,sans-serif" font-size="15">Exact contribution calendar unavailable without a GITHUB_TOKEN.</text><text x="30" y="120" fill="#7f8db8" font-family="Inter,Arial,sans-serif" font-size="12">Run with a GitHub token locally or in Actions to populate the calendar from GitHub GraphQL.</text></svg>